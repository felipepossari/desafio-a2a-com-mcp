[project]
name = "central-de-salas"
version = "1.0.0"
description = "Servidor MCP (2026-07-28) da Central de Salas"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/central_de_salas"]

[tool.pytest.ini_options]
pythonpath = ["src"]

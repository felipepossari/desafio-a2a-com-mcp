[project]
name = "agente-central-de-salas"
version = "1.0.0"
description = "Agente A2A v1.0 (JSON-RPC) que consome o servidor MCP da Central de Salas"
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agente"]

[tool.pytest.ini_options]
pythonpath = ["src"]
